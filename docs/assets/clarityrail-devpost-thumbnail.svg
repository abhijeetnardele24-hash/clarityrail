<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <title>ClarityRail Devpost Submission Thumbnail</title>
  <desc>Devpost submission thumbnail for ClarityRail: From messy instructions to one clear, traceable next step.</desc>

  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF6" />
      <stop offset="100%" stop-color="#F5F2EA" />
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075CCB" />
      <stop offset="100%" stop-color="#0548A1" />
    </linearGradient>

    <filter id="shadowCard" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#17212B" flood-opacity="0.12" />
    </filter>

    <style>
      .text-hero { font-family: 'Manrope', -apple-system, sans-serif; font-weight: 800; font-size: 54px; fill: #17212B; letter-spacing: -0.03em; }
      .text-tagline { font-family: 'Atkinson Hyperlegible', sans-serif; font-weight: 700; font-size: 24px; fill: #52606D; line-height: 1.4; }
      .text-badge { font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; }
      .text-card-step { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 28px; fill: #17212B; }
      .text-card-cue { font-family: 'Atkinson Hyperlegible', sans-serif; font-weight: 600; font-size: 16px; fill: #075CCB; }
      .text-card-sub { font-family: 'Atkinson Hyperlegible', sans-serif; font-size: 15px; fill: #52606D; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#gradBg)" />

  <!-- Outer Editorial Border Frame -->
  <rect x="24" y="24" width="1232" height="672" rx="28" fill="none" stroke="#D8D4CA" stroke-width="2" />

  <!-- Brand Section (Left Side) -->
  <g transform="translate(80, 100)">
    <!-- Hackathon & Category Pill -->
    <rect x="0" y="0" width="310" height="34" rx="17" fill="#EBF3FC" stroke="#075CCB" stroke-width="1.5" />
    <text x="16" y="22" class="text-badge" fill="#075CCB">&bull; TASKFORGE HACKATHON 2026</text>

    <!-- Main Title -->
    <text x="0" y="95" class="text-hero">ClarityRail</text>

    <!-- Tagline -->
    <text x="0" y="145" class="text-tagline">
      From messy instructions to one clear,
    </text>
    <text x="0" y="178" class="text-tagline" fill="#075CCB">
      traceable next step.
    </text>

    <text x="0" y="235" style="font-family: 'Atkinson Hyperlegible', sans-serif; font-size: 17px; fill: #52606D; max-width: 500px;">
      A local-first cognitive-accessibility workspace for students
    </text>
    <text x="0" y="260" style="font-family: 'Atkinson Hyperlegible', sans-serif; font-size: 17px; fill: #52606D;">
      facing working-memory overload and initiation paralysis.
    </text>

    <!-- Key Feature Badges Grid -->
    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="230" height="42" rx="8" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="1.5" />
      <text x="16" y="26" class="text-badge" fill="#17212B">&check; 4-PART CLARITY CONTRACT</text>

      <rect x="245" y="0" width="220" height="42" rx="8" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="1.5" />
      <text x="261" y="26" class="text-badge" fill="#17212B">&check; ZERO CLOUD TELEMETRY</text>

      <rect x="0" y="54" width="230" height="42" rx="8" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="1.5" />
      <text x="16" y="80" class="text-badge" fill="#17212B">&check; STALE INVALIDATION</text>

      <rect x="245" y="54" width="220" height="42" rx="8" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="1.5" />
      <text x="261" y="80" class="text-badge" fill="#17212B">&check; DEPENDENCY DETOUR</text>
    </g>

    <!-- Metric Callout -->
    <g transform="translate(0, 440)">
      <rect x="0" y="0" width="465" height="54" rx="8" fill="#EDF7F1" stroke="#176B45" stroke-width="1.5" />
      <text x="18" y="33" class="text-badge" fill="#176B45">
        &check; 100% REPEATABILITY &bull; 0 UNSUPPORTED ACTIONS &bull; 95% F1
      </text>
    </g>
  </g>

  <!-- Interactive Focus Rail Hero Mockup (Right Side) -->
  <g transform="translate(620, 90)">
    <!-- Main Focus Card -->
    <rect width="570" height="530" rx="20" fill="#FFFFFF" stroke="#075CCB" stroke-width="3" filter="url(#shadowCard)" />

    <!-- Card Top Header -->
    <g transform="translate(36, 40)">
      <rect x="0" y="0" width="130" height="28" rx="4" fill="#EBF3FC" />
      <text x="12" y="19" style="font-family: monospace; font-size: 13px; font-weight: bold; fill: #075CCB;">
        STEP 1 OF 5
      </text>

      <rect x="360" y="0" width="140" height="28" rx="4" fill="#EDF7F1" stroke="#176B45" stroke-width="1" />
      <text x="370" y="19" style="font-family: monospace; font-size: 12px; font-weight: bold; fill: #176B45;">
        DIRECT EVIDENCE
      </text>
    </g>

    <!-- Action Title -->
    <g transform="translate(36, 115)">
      <text x="0" y="0" class="text-card-step">
        Download the starter
      </text>
      <text x="0" y="36" class="text-card-step">
        repository from GitHub.
      </text>

      <!-- Cue Phrase Box -->
      <g transform="translate(0, 70)">
        <rect width="498" height="64" rx="8" fill="#FCFAF6" stroke="#D8D4CA" stroke-width="1.5" />
        <text x="16" y="24" style="font-family: monospace; font-size: 11px; font-weight: bold; fill: #52606D; text-transform: uppercase;">
          ACTION CUE (IMPLEMENTATION INTENTION)
        </text>
        <text x="16" y="48" class="text-card-cue">
          When I open the course portal, I will clone the repo.
        </text>
      </g>

      <!-- Source Lineage Box -->
      <g transform="translate(0, 155)">
        <rect width="498" height="80" rx="8" fill="#F5F2EA" stroke="#D8D4CA" stroke-width="1" />
        <text x="16" y="24" style="font-family: 'Manrope', sans-serif; font-size: 12px; font-weight: bold; fill: #17212B;">
          SOURCE CLAUSE #1 (CHARACTERS 0–45)
        </text>
        <text x="16" y="52" style="font-family: 'Atkinson Hyperlegible', sans-serif; font-style: italic; font-size: 14px; fill: #52606D;">
          &ldquo;Please download the lab starter repository from GitHub.&rdquo;
        </text>
      </g>

      <!-- Primary Action Buttons Mockup -->
      <g transform="translate(0, 270)">
        <!-- Done Button -->
        <rect width="190" height="52" rx="10" fill="url(#blueGrad)" />
        <text x="35" y="32" style="font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 16px; fill: #FFFFFF;">
          &check; Mark Done &amp; Next
        </text>

        <!-- Blocked Button -->
        <rect x="206" y="0" width="135" height="52" rx="10" fill="#FEF7ED" stroke="#F59E0B" stroke-width="1.5" />
        <text x="228" y="32" style="font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px; fill: #8A4B00;">
          &bull; I&apos;m Blocked
        </text>

        <!-- Break Down Button -->
        <rect x="355" y="0" width="143" height="52" rx="10" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="1.5" />
        <text x="375" y="32" style="font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px; fill: #17212B;">
          &divide; Break Down
        </text>
      </g>
    </g>
  </g>
</svg>
