<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" width="1400" height="850">
  <title>ClarityRail PlanStep State Lifecycle and Invariant Engine</title>
  <desc>State transition diagram showing states (PROPOSED, READY, ACTIVE, BLOCKED, STALE, DONE, SKIPPED), valid transitions, and the Change Impact Guard review barrier.</desc>

  <defs>
    <style>
      .bg { fill: #F5F2EA; }
      .state-box { rx: 14px; stroke-width: 2.5px; }
      .state-proposed { fill: #FFFFFF; stroke: #52606D; }
      .state-ready { fill: #EBF3FC; stroke: #075CCB; }
      .state-active { fill: #075CCB; stroke: #0548A1; }
      .state-blocked { fill: #FEF7ED; stroke: #F59E0B; }
      .state-stale { fill: #FEF3C7; stroke: #D97706; }
      .state-done { fill: #EDF7F1; stroke: #176B45; }
      .state-skipped { fill: #F1F5F9; stroke: #94A3B8; }

      .trans-line { stroke: #52606D; stroke-width: 2.5px; fill: none; stroke-linecap: round; }
      .trans-stale { stroke: #D97706; stroke-width: 3px; fill: none; stroke-dasharray: 6 5; }
      .trans-review { stroke: #176B45; stroke-width: 3px; fill: none; }
      .trans-arrow { fill: #52606D; }
      .trans-arrow-stale { fill: #D97706; }
      .trans-arrow-review { fill: #176B45; }

      .text-title { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 26px; fill: #17212B; }
      .text-sub { font-family: 'Atkinson Hyperlegible', sans-serif; font-size: 16px; fill: #52606D; }
      .text-state { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 19px; }
      .text-desc { font-family: 'Atkinson Hyperlegible', sans-serif; font-size: 13.5px; fill: #52606D; }
      .text-label { font-family: 'Atkinson Hyperlegible', sans-serif; font-weight: 700; font-size: 13px; fill: #17212B; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="trans-arrow" />
    </marker>
    <marker id="arrow-stale" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="trans-arrow-stale" />
    </marker>
    <marker id="arrow-review" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="trans-arrow-review" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="850" class="bg" />

  <text x="80" y="70" class="text-title">ClarityRail PlanStep State Machine &amp; Invariants</text>
  <text x="80" y="100" class="text-sub">Deterministic Lifecycle: Change Invalidation, Dependency-Safe Detours, and Review Gates</text>

  <!-- Initial Entry Point -->
  <circle cx="100" cy="260" r="14" fill="#075CCB" />
  <path d="M 114 260 L 175 260" class="trans-line" marker-end="url(#arrow)" />
  <text x="90" y="300" class="text-label">Compiler Output</text>

  <!-- State 1: PROPOSED -->
  <g transform="translate(180, 200)">
    <rect width="210" height="120" class="state-box state-proposed" />
    <text x="20" y="40" class="text-state" fill="#17212B">PROPOSED</text>
    <text x="20" y="70" class="text-desc">&bull; Extracted from brief</text>
    <text x="20" y="92" class="text-desc">&bull; Waiting on prerequisites</text>
  </g>

  <!-- Transition PROPOSED -> READY -->
  <path d="M 390 260 L 485 260" class="trans-line" marker-end="url(#arrow)" />
  <text x="400" y="245" class="text-label">All Prereqs Done</text>

  <!-- State 2: READY -->
  <g transform="translate(490, 200)">
    <rect width="210" height="120" class="state-box state-ready" />
    <text x="20" y="40" class="text-state" fill="#075CCB">READY</text>
    <text x="20" y="70" class="text-desc">&bull; Prerequisites satisfied</text>
    <text x="20" y="92" class="text-desc">&bull; Eligible for focus rail</text>
  </g>

  <!-- Transition READY -> ACTIVE -->
  <path d="M 700 260 L 795 260" class="trans-line" marker-end="url(#arrow)" />
  <text x="715" y="245" class="text-label">Presents in Rail</text>

  <!-- State 3: ACTIVE -->
  <g transform="translate(800, 195)">
    <rect width="220" height="130" class="state-box state-active" />
    <text x="20" y="42" class="text-state" fill="#FFFFFF">ACTIVE</text>
    <text x="20" y="72" class="text-desc" fill="#E2E8F0">&bull; Single active focus step</text>
    <text x="20" y="94" class="text-desc" fill="#E2E8F0">&bull; Action cue intention</text>
    <text x="20" y="116" class="text-desc" fill="#E2E8F0">&bull; Source evidence shown</text>
  </g>

  <!-- Transition ACTIVE -> DONE -->
  <path d="M 1020 260 L 1115 260" class="trans-line" marker-end="url(#arrow)" />
  <text x="1035" y="245" class="text-label">Mark Done</text>

  <!-- State 4: DONE -->
  <g transform="translate(1120, 200)">
    <rect width="200" height="120" class="state-box state-done" />
    <text x="20" y="40" class="text-state" fill="#176B45">DONE</text>
    <text x="20" y="70" class="text-desc">&bull; Completed task</text>
    <text x="20" y="92" class="text-desc">&bull; Unblocks dependents</text>
  </g>

  <!-- State 5: BLOCKED -->
  <g transform="translate(800, 430)">
    <rect width="220" height="120" class="state-box state-blocked" />
    <text x="20" y="40" class="text-state" fill="#8A4B00">BLOCKED</text>
    <text x="20" y="70" class="text-desc">&bull; User clicked &quot;I&apos;m Blocked&quot;</text>
    <text x="20" y="92" class="text-desc">&bull; Open ambiguity blocker</text>
  </g>

  <!-- ACTIVE -> BLOCKED -->
  <path d="M 910 325 L 910 425" class="trans-line" marker-end="url(#arrow)" />
  <text x="918" y="375" class="text-label">&quot;I&apos;m Blocked&quot;</text>

  <!-- BLOCKED -> Detour Arrow to READY -->
  <path d="M 800 490 Q 600 520 595 325" class="trans-line" marker-end="url(#arrow)" />
  <rect x="580" y="465" width="220" height="30" rx="6" fill="#FFFFFF" stroke="#075CCB" stroke-width="1.5" />
  <text x="590" y="485" class="text-label" fill="#075CCB">&bull; Dependency-Safe Detour</text>

  <!-- State 6: STALE (Change Impact Guard) -->
  <g transform="translate(480, 600)">
    <rect width="320" height="140" class="state-box state-stale" />
    <text x="20" y="40" class="text-state" fill="#92400E">STALE (INVALIDATED)</text>
    <text x="20" y="70" class="text-desc">&bull; Source clause revised or removed</text>
    <text x="20" y="92" class="text-desc">&bull; Downstream transitive dependency</text>
    <text x="20" y="118" class="text-label" fill="#B45309">INVARIANT: Cannot execute without review</text>
  </g>

  <!-- Invalidation Transitions (Source revision altered) -->
  <path d="M 285 320 Q 340 670 475 670" class="trans-stale" marker-end="url(#arrow-stale)" />
  <path d="M 595 320 L 595 595" class="trans-stale" marker-end="url(#arrow-stale)" />
  <path d="M 910 550 Q 910 670 805 670" class="trans-stale" marker-end="url(#arrow-stale)" />

  <rect x="360" y="540" width="160" height="26" rx="4" fill="#FEF3C7" stroke="#D97706" />
  <text x="368" y="557" class="text-desc" fill="#92400E">&bull; Source Revision Diff</text>

  <!-- STALE -> READY (Explicit User Confirmation Gate) -->
  <path d="M 520 600 Q 470 420 520 325" class="trans-review" marker-end="url(#arrow-review)" />
  <rect x="360" y="380" width="180" height="42" rx="6" fill="#EDF7F1" stroke="#176B45" stroke-width="1.5" />
  <text x="368" y="398" class="text-label" fill="#176B45">Review &amp; Confirmation Gate</text>
  <text x="368" y="414" class="text-desc" fill="#176B45">confirmStaleStepReview()</text>

  <!-- Illegal Direct Jump Barred -->
  <g transform="translate(1080, 560)">
    <rect width="250" height="150" rx="10" fill="#FDF2F2" stroke="#A12622" stroke-width="2" />
    <text x="18" y="34" class="text-label" fill="#A12622">ILLEGAL INVARIANTS</text>
    <text x="18" y="64" class="text-desc">&cross; STALE &rarr; ACTIVE directly</text>
    <text x="18" y="90" class="text-desc">&cross; STALE &rarr; DONE silently</text>
    <text x="18" y="116" class="text-desc">&cross; BLOCKED &rarr; Detour with stale deps</text>
  </g>
</svg>
