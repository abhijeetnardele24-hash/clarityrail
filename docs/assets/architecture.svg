<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>ClarityRail System Architecture and Data Flow</title>
  <desc>System architecture diagram illustrating local-first cognitive accessibility workflow, deterministic compiler, state store, and persistence boundary.</desc>

  <defs>
    <style>
      .bg { fill: #F5F2EA; }
      .surface { fill: #FFFFFF; stroke: #D8D4CA; stroke-width: 2px; rx: 12px; }
      .surface-hero { fill: #FFFFFF; stroke: #075CCB; stroke-width: 3px; rx: 16px; }
      .surface-highlight { fill: #FCFAF6; stroke: #176B45; stroke-width: 2px; rx: 12px; }
      .surface-stale { fill: #FEF3C7; stroke: #D97706; stroke-width: 2px; rx: 12px; }
      .boundary { fill: none; stroke: #075CCB; stroke-width: 2px; stroke-dasharray: 8 6; rx: 20px; }
      .wire { stroke: #52606D; stroke-width: 2.5px; fill: none; stroke-linecap: round; }
      .wire-accent { stroke: #075CCB; stroke-width: 3px; fill: none; stroke-linecap: round; }
      .wire-arrow { fill: #075CCB; }
      .text-title { font-family: 'Manrope', -apple-system, sans-serif; font-weight: 800; font-size: 26px; fill: #17212B; }
      .text-header { font-family: 'Manrope', -apple-system, sans-serif; font-weight: 700; font-size: 20px; fill: #17212B; }
      .text-body { font-family: 'Atkinson Hyperlegible', sans-serif; font-size: 15px; fill: #52606D; }
      .text-bold { font-family: 'Atkinson Hyperlegible', sans-serif; font-weight: 700; font-size: 15px; fill: #17212B; }
      .text-mono { font-family: monospace; font-size: 13px; fill: #075CCB; font-weight: bold; }
      .badge-tag { fill: #EBF3FC; stroke: #075CCB; stroke-width: 1px; rx: 4px; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="wire-arrow" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" class="bg" />

  <!-- Top Banner -->
  <text x="80" y="70" class="text-title">ClarityRail Architecture &amp; Data Pipeline</text>
  <text x="80" y="100" class="text-body">Local-First Cognitive Accessibility Engine &middot; Taskforge 2026 Submission Architecture</text>

  <!-- Sandbox Boundary Box -->
  <rect x="60" y="130" width="1480" height="710" class="boundary" />
  <rect x="90" y="118" width="360" height="26" class="badge-tag" />
  <text x="100" y="136" class="text-mono">CLIENT-SIDE APPLICATION BOUNDARY</text>

  <!-- 1. Input Source Layer -->
  <g transform="translate(100, 180)">
    <rect width="280" height="420" class="surface" />
    <text x="24" y="44" class="text-header">1. Source Brief Input</text>
    <text x="24" y="74" class="text-body">Multi-clause unstructured text</text>

    <!-- Sub-boxes -->
    <rect x="20" y="100" width="240" height="85" rx="8" fill="#F5F2EA" stroke="#D8D4CA" stroke-width="1.5" />
    <text x="32" y="128" class="text-bold">Raw Text / PDF / Email</text>
    <text x="32" y="152" class="text-body">&bull; Assignments &amp; Handouts</text>
    <text x="32" y="172" class="text-body">&bull; Group Project Handoffs</text>

    <rect x="20" y="205" width="240" height="90" rx="8" fill="#F5F2EA" stroke="#D8D4CA" stroke-width="1.5" />
    <text x="32" y="233" class="text-bold">Versioned Source Storage</text>
    <text x="32" y="257" class="text-body">&bull; Canonical SHA-256 digest</text>
    <text x="32" y="277" class="text-body">&bull; Parent revision linkage</text>

    <rect x="20" y="315" width="240" height="80" rx="8" fill="#EDF7F1" stroke="#176B45" stroke-width="1.5" />
    <text x="32" y="343" class="text-bold" fill="#176B45">No Application Backend</text>
    <text x="32" y="367" class="text-body">Brief stays in browser storage</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 380 390 L 450 390" class="wire-accent" marker-end="url(#arrow)" />

  <!-- 2. Deterministic Compiler Engine -->
  <g transform="translate(460, 180)">
    <rect width="320" height="610" class="surface-hero" />
    <text x="24" y="44" class="text-header">2. Pure Compiler Pipeline</text>
    <text x="24" y="74" class="text-body">Deterministic TypeScript Module</text>

    <!-- Stage A: Segmenter -->
    <rect x="20" y="100" width="280" height="100" rx="8" fill="#FCFAF6" stroke="#D8D4CA" stroke-width="1.5" />
    <text x="32" y="128" class="text-bold">A. Clause Segmenter</text>
    <text x="32" y="150" class="text-body">&bull; Sentence &amp; list boundary split</text>
    <text x="32" y="170" class="text-body">&bull; Exact start/end char offsets</text>
    <text x="32" y="190" class="text-mono">raw.slice(start, end) === text</text>

    <!-- Stage B: Extractor -->
    <rect x="20" y="220" width="280" height="110" rx="8" fill="#FCFAF6" stroke="#D8D4CA" stroke-width="1.5" />
    <text x="32" y="248" class="text-bold">B. Action &amp; Entity Extractor</text>
    <text x="32" y="270" class="text-body">&bull; Imperative verbs (download, draft)</text>
    <text x="32" y="290" class="text-body">&bull; Deliverable formats (PDF, ZIP)</text>
    <text x="32" y="310" class="text-body">&bull; Effort range estimation (min/max)</text>

    <!-- Stage C: Dependency DAG -->
    <rect x="20" y="350" width="280" height="110" rx="8" fill="#FCFAF6" stroke="#D8D4CA" stroke-width="1.5" />
    <text x="32" y="378" class="text-bold">C. Dependency &amp; DAG Graph</text>
    <text x="32" y="400" class="text-body">&bull; Markers: before, after, while</text>
    <text x="32" y="420" class="text-body">&bull; Tarjan DFS cycle detection</text>
    <text x="32" y="440" class="text-body">&bull; Cycle recovery explanation</text>

    <!-- Stage D: Ambiguity Detector -->
    <rect x="20" y="480" width="280" height="110" rx="8" fill="#FEF7ED" stroke="#F59E0B" stroke-width="1.5" />
    <text x="32" y="508" class="text-bold" fill="#8A4B00">D. Ambiguity Rules</text>
    <text x="32" y="530" class="text-body">&bull; Missing format &amp; cutoff times</text>
    <text x="32" y="550" class="text-body">&bull; Unassigned group members</text>
    <text x="32" y="570" class="text-body">&bull; Subjective scope language</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 780 390 L 850 390" class="wire-accent" marker-end="url(#arrow)" />

  <!-- 3. Living Contract & State Machine -->
  <g transform="translate(860, 180)">
    <rect width="320" height="610" class="surface" />
    <text x="24" y="44" class="text-header">3. Four-Part Clarity Contract</text>
    <text x="24" y="74" class="text-body">Zustand State Store Engine</text>

    <!-- Contract 1 -->
    <rect x="20" y="100" width="280" height="100" rx="8" fill="#EBF3FC" stroke="#075CCB" stroke-width="1.5" />
    <text x="32" y="128" class="text-bold" fill="#075CCB">1. Evidence Thread</text>
    <text x="32" y="150" class="text-body">&bull; Clause ID and source offsets</text>
    <text x="32" y="170" class="text-body">&bull; Direct / Derived / Confirmed</text>
    <text x="32" y="190" class="text-mono">Unsupported actions are discarded</text>

    <!-- Contract 2 -->
    <rect x="20" y="220" width="280" height="100" rx="8" fill="#FEF7ED" stroke="#F59E0B" stroke-width="1.5" />
    <text x="32" y="248" class="text-bold" fill="#8A4B00">2. Ambiguity Gate</text>
    <text x="32" y="270" class="text-body">&bull; Open questions block tasks</text>
    <text x="32" y="290" class="text-body">&bull; Explicit user confirmation</text>
    <text x="32" y="310" class="text-body">&bull; Answered / Assumption</text>

    <!-- Contract 3 -->
    <rect x="20" y="340" width="280" height="110" class="surface-stale" />
    <text x="32" y="368" class="text-bold" fill="#92400E">3. Change Impact Guard</text>
    <text x="32" y="390" class="text-body">&bull; Source revision clause diff</text>
    <text x="32" y="410" class="text-body">&bull; Direct &amp; transitive STALE invalidation</text>
    <text x="32" y="430" class="text-body">&bull; Mandatory review before READY</text>

    <!-- Contract 4 -->
    <rect x="20" y="470" width="280" height="120" rx="8" fill="#EDF7F1" stroke="#176B45" stroke-width="1.5" />
    <text x="32" y="498" class="text-bold" fill="#176B45">4. Dependency-Safe Detour</text>
    <text x="32" y="520" class="text-body">&bull; Computes valid independent work</text>
    <text x="32" y="540" class="text-body">&bull; Filters blocked/stale ancestors</text>
    <text x="32" y="560" class="text-body">&bull; 1-sentence eligibility proof</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 1180 390 L 1250 390" class="wire-accent" marker-end="url(#arrow)" />

  <!-- 4. Presentation & Persistence Layer -->
  <g transform="translate(1260, 180)">
    <rect width="250" height="610" class="surface" />
    <text x="20" y="44" class="text-header">4. UI &amp; Storage</text>
    <text x="20" y="74" class="text-body">Accessible interaction layer</text>

    <!-- Hero Focus Rail -->
    <rect x="15" y="100" width="220" height="110" rx="8" fill="#FCFAF6" stroke="#075CCB" stroke-width="2" />
    <text x="26" y="128" class="text-bold">Focus Rail (Hero)</text>
    <text x="26" y="150" class="text-body">&bull; One action view</text>
    <text x="26" y="170" class="text-body">&bull; Cue-action phrase</text>
    <text x="26" y="190" class="text-body">&bull; Why this step? reveal</text>

    <!-- Resume Capsule -->
    <rect x="15" y="230" width="220" height="95" rx="8" fill="#FCFAF6" stroke="#D8D4CA" stroke-width="1.5" />
    <text x="26" y="258" class="text-bold">Resume Capsule</text>
    <text x="26" y="280" class="text-body">&bull; Interruption recovery</text>
    <text x="26" y="300" class="text-body">&bull; Last done &amp; next cue</text>

    <!-- IndexedDB Persistence -->
    <rect x="15" y="345" width="220" height="110" rx="8" fill="#FCFAF6" stroke="#D8D4CA" stroke-width="1.5" />
    <text x="26" y="373" class="text-bold">IndexedDB (Dexie)</text>
    <text x="26" y="395" class="text-body">&bull; Schema v1 &amp; v2 migration</text>
    <text x="26" y="415" class="text-body">&bull; Session &amp; preference state</text>
    <text x="26" y="435" class="text-body">&bull; LocalStorage fallback</text>

    <!-- Workbox PWA -->
    <rect x="15" y="475" width="220" height="115" rx="8" fill="#FCFAF6" stroke="#D8D4CA" stroke-width="1.5" />
    <text x="26" y="503" class="text-bold">Workbox Service Worker</text>
    <text x="26" y="525" class="text-body">&bull; Offline shell caching</text>
    <text x="26" y="545" class="text-body">&bull; StaleWhileRevalidate</text>
    <text x="26" y="565" class="text-body">&bull; Tested offline reload</text>
  </g>
</svg>
