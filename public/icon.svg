<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="railGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075CCB" />
      <stop offset="100%" stop-color="#0548A1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="#F5F2EA" />
  <rect x="24" y="24" width="464" height="464" rx="80" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="12" />
  
  <!-- Rail Track Lines -->
  <line x1="160" y1="80" x2="160" y2="432" stroke="#D8D4CA" stroke-width="16" stroke-linecap="round" />
  <line x1="352" y1="80" x2="352" y2="432" stroke="#D8D4CA" stroke-width="16" stroke-linecap="round" />
  
  <!-- Rail Ties -->
  <line x1="130" y1="140" x2="382" y2="140" stroke="#D8D4CA" stroke-width="14" stroke-linecap="round" />
  <line x1="130" y1="256" x2="382" y2="256" stroke="#D8D4CA" stroke-width="14" stroke-linecap="round" />
  <line x1="130" y1="372" x2="382" y2="372" stroke="#D8D4CA" stroke-width="14" stroke-linecap="round" />

  <!-- Active Focus Node / Waypoint -->
  <circle cx="256" cy="256" r="64" fill="url(#railGrad)" stroke="#FFFFFF" stroke-width="12" />
  <polygon points="240,224 288,256 240,288" fill="#FFFFFF" />
  
  <!-- Subtle Source Lineage Pointer -->
  <circle cx="160" cy="140" r="16" fill="#176B45" />
</svg>
