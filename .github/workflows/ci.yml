name: ClarityRail CI & Verification Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Use Current npm Audit Client
        run: npm install --global npm@11.6.2

      - name: Install Dependencies
        run: npm ci --no-audit

      - name: Initialize Clean Verification Run
        run: npm run verify:start

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint Code Quality
        run: npm run lint

      - name: "Vitest Unit and Coverage Suite (Thresholds: Stmts >= 85%, Branches >= 80%)"
        run: npm test

      - name: Deterministic Compiler Benchmark (40 briefs)
        run: npm run benchmark:rules

      - name: Security & Claims Integrity Scan
        run: npm run security-scan

      - name: High-Severity Dependency Audit
        run: npm run audit

      - name: Production Bundle Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright Cross-Device & Accessibility E2E
        run: npm run test:e2e

      - name: Generate Authoritative Verification Evidence
        run: npm run evidence:report

      - name: Validate Authoritative Verification Evidence
        run: npm run evidence:check

      - name: Upload Verification Evidence
        uses: actions/upload-artifact@v4
        with:
          name: clarityrail-verification-evidence
          path: |
            docs/verification-results.json
            docs/benchmark-results.json
            reports/axe-results.json
            reports/vitest-results.json
            test-results/results.json
            coverage/coverage-summary.json

      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
